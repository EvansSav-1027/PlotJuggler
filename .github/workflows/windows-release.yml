name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      update_url:
        description: >-
          Staging update repository. Empty means no update repository.
          The production URL is refused.
        type: string
        default: ""
      version:
        description: >-
          Version to stamp (default: PJ_APP_VERSION).
        type: string
        default: ""
      update_check_from_run:
        description: >-
          ID of an earlier run of this workflow built with the same update_url
          and a lower version. Its installer is installed, then updated.
        type: string
        default: ""
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 350
    outputs:
      version: ${{ steps.version.outputs.version }}
      update_url: ${{ env.PJ_WINDOWS_UPDATE_URL }}
    env:
      PJ_WINDOWS_UPDATE_URL: ${{ github.event_name == 'push' && vars.PJ4_WINDOWS_UPDATE_URL || (github.event_name == 'workflow_dispatch' && inputs.update_url || '') }}

    steps:
      - name: Use HTTPS for github.com submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions.env
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"

      - name: Resolve installer version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${INPUT_VERSION:-${PJ_APP_VERSION}}"
          fi
          echo "PJ_VERSION=${v}" >> "$GITHUB_ENV"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to rehearse against the production update channel
        if: github.event_name != 'push' && env.PJ_WINDOWS_UPDATE_URL != ''
        shell: bash
        env:
          PROD_URL: ${{ vars.PJ4_WINDOWS_UPDATE_URL }}
        run: |
          set -euo pipefail
          prefix_of() {
            local p="${1#*://}"
            [[ "${p}" == */* ]] && p="${p#*/}" || p=""
            printf '%s' "${p}" | tr -s '/' | sed 's#^/##; s#/$##'
          }
          if [[ -n "${PROD_URL}" && "$(prefix_of "${PJ_WINDOWS_UPDATE_URL}")" == "$(prefix_of "${PROD_URL}")" ]]; then
            echo "::error::update_url publishes to the production prefix of ${PROD_URL}; use a staging prefix." >&2
            exit 1
          fi
          echo "Rehearsing against ${PJ_WINDOWS_UPDATE_URL}"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compute Conan cache key
        id: public_conan_cache
        shell: pwsh
        run: |
          $cacheVersion = "v6"
          $combined = (Get-FileHash conanfile.txt -Algorithm SHA256).Hash + (Get-FileHash conan.lock -Algorithm SHA256).Hash
          $stream = [System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($combined))
          $fileHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          $hash = "$cacheVersion-$fileHash"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "restore_prefix=conan-windows-msvc-relwithdebinfo-$cacheVersion-" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Conan cache
        id: conan-gha-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.public_conan_cache.outputs.hash }}
          restore-keys: |
            ${{ steps.public_conan_cache.outputs.restore_prefix }}

      - name: Seed Conan source download cache
        shell: pwsh
        run: |
          $cacheDir = (Join-Path $env:RUNNER_TEMP "conan-source-cache").Replace('\', '/')
          New-Item -ItemType Directory -Force -Path "$cacheDir/s" | Out-Null
          if (Test-Path ".github/conan/source-backup") {
            Get-ChildItem ".github/conan/source-backup" -Exclude "README.md" |
              Copy-Item -Destination "$cacheDir/s"
          }
          $conanHome = (conan config home | Out-String).Trim()
          $conf = Join-Path $conanHome "global.conf"
          $lines = @()
          if (Test-Path $conf) {
            $lines = @(Get-Content $conf | Where-Object { $_ -notmatch '^core\.sources:(download_cache|download_urls)=' })
          }
          $lines += "core.sources:download_cache=$cacheDir"
          $lines += 'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]'
          $lines | Set-Content $conf

      - name: Restore Qt SDK cache
        id: qt-sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt/${{ env.PJ_QT_VERSION }}/msvc2022_64
          key: qt-sdk-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-v1

      - name: Restore Qt Installer Framework cache
        id: qt-ifw-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt/Tools/QtInstallerFramework/4.7
          key: qt-ifw-4.7-windows-v1

      - name: Verify Qt SDK cache content
        id: qt-sdk-verify
        shell: bash
        run: |
          if [[ -x ".qt/${PJ_QT_VERSION}/msvc2022_64/bin/qmake.exe" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Qt Installer Framework cache content
        id: qt-ifw-verify
        shell: bash
        run: |
          if [[ -x ".qt/Tools/QtInstallerFramework/4.7/bin/binarycreator.exe" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install aqt
        if: steps.qt-sdk-verify.outputs.valid != 'true' || steps.qt-ifw-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"

      - name: Install Qt SDK via aqt
        if: steps.qt-sdk-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".qt/${PJ_QT_VERSION}/msvc2022_64"
          attempt=0
          until aqt install-qt windows desktop "${PJ_QT_VERSION}" win64_msvc2022_64 --outputdir ./.qt; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "aqt install-qt failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "aqt attempt ${attempt} failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Install Qt Installer Framework via aqt
        if: steps.qt-ifw-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qt/Tools/QtInstallerFramework/4.7
          aqt install-tool --outputdir ./.qt windows desktop tools_ifw

      - name: Save Qt SDK cache
        if: steps.qt-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .qt/${{ env.PJ_QT_VERSION }}/msvc2022_64
          key: qt-sdk-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-v1

      - name: Save Qt Installer Framework cache
        if: steps.qt-ifw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .qt/Tools/QtInstallerFramework/4.7
          key: qt-ifw-4.7-windows-v1

      - name: Install sccache
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Conan install
        id: conan_install
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect --force
          scripts/configure_conan_remote.sh
          conan_log="${RUNNER_TEMP}/pj4-conan-install.log"
          conan install . --output-folder=build --build=missing -r=plotjuggler-conan -r=conancenter \
            --lockfile=conan.lock --lockfile-partial \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
            -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config" \
            2>&1 | tee "$conan_log"
          if grep -q "Building from source" "$conan_log"; then
            echo "::notice::Conan built missing binaries; the cache save below persists them."
          fi
          echo "Checking Conan-generated toolchain..."
          if [[ ! -f build/conan_toolchain.cmake ]]; then
            echo "::error::Conan completed but build/conan_toolchain.cmake is missing."
            find build -maxdepth 4 -iname '*toolchain*.cmake' -print || true
            exit 1
          fi
          echo "Conan toolchain exists: $(pwd)/build/conan_toolchain.cmake"

      - name: Trim Conan cache before saving
        if: steps.conan_install.outcome == 'success' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache
        if: steps.conan_install.outcome == 'success' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.public_conan_cache.outputs.hash }}

      - name: Build PlotJuggler 4 (app)
        shell: bash
        env:
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          set -euo pipefail
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi
          toolchain="$(pwd)/build/conan_toolchain.cmake"
          if [[ ! -f "$toolchain" ]]; then
            echo "::error::Missing Conan toolchain: $toolchain"
            exit 1
          fi
          cmake -S . -B build -G "Ninja Multi-Config" \
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" \
            -DCMAKE_PREFIX_PATH="$(pwd)/.qt/${PJ_QT_VERSION}/msvc2022_64" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            -DPJ_INSTALLATION=windows \
            "${launcher_args[@]}"
          cmake --build build --config RelWithDebInfo --target pj_app --parallel
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
          fi

      - name: Clean SAV plugin build directory
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          $path = Join-Path $env:GITHUB_WORKSPACE "build-savb"
          Write-Host "Cleaning SAV plugin build directory: $path"
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $path) {
            throw "Could not remove stale SAV plugin build directory: $path"
          }
          Write-Host "Verified: build-savb does not exist"

      - name: Build the SAV log loader plugin
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $workspace "build\conan_toolchain.cmake"
          $pluginSource = Join-Path $workspace "plugins\data_load_savb"
          $pluginBuild = Join-Path $workspace "build-savb"

          Write-Host "Workspace: $workspace"
          Write-Host "Plugin source: $pluginSource"
          Write-Host "Plugin build directory: $pluginBuild"
          Write-Host "Expected Conan toolchain: $toolchain"

          if (Test-Path (Join-Path $pluginBuild "CMakeCache.txt")) {
            Write-Host "Unexpected CMake cache found before plugin configuration."
            Get-Content (Join-Path $pluginBuild "CMakeCache.txt") |
              Select-String "CMAKE_HOME_DIRECTORY|CMAKE_CACHEFILE_DIR"
            throw "Stale CMakeCache exists after the clean step"
          }

          if (-not (Test-Path -LiteralPath $toolchain -PathType Leaf)) {
            Write-Host "::error::Conan toolchain is missing: $toolchain"
            Write-Host "Searching workspace for conan_toolchain.cmake..."
            Get-ChildItem -LiteralPath $workspace -Recurse -File `
              -Filter "conan_toolchain.cmake" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            if (Test-Path "build") {
              Write-Host "Build directory contents:"
              Get-ChildItem "build" -Force | Select-Object Name, Mode, Length
            } else {
              Write-Host "The build directory does not exist."
            }
            throw "Conan toolchain was not found. Check the Conan install step and output folder."
          }

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $ninja) {
            Write-Host "::error::Ninja is not available on PATH."
            Write-Host "PATH: $env:PATH"
            throw "Ninja is missing. Check the Install cmake and ninja step."
          }
          Write-Host "Ninja executable: $($ninja.Source)"
          & $ninja.Source --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja version check failed." }

          cmake -S $pluginSource -B $pluginBuild -G "Ninja Multi-Config" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DSAVB_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "SAV plugin configure failed" }

          cmake --build $pluginBuild --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw "SAV plugin build failed" }

          $dll = Get-ChildItem $pluginBuild -Recurse -File `
            -Filter "savb_source_plugin.dll" | Select-Object -First 1
          if (-not $dll) { throw "savb_source_plugin.dll was not produced" }

          $dest = "dist-plugins/sav-log-loader"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination $dest
          Copy-Item "plugins/data_load_savb/manifest.json" -Destination $dest
          Get-ChildItem $dest

      - name: Build the installer
        shell: pwsh
        run: |
          $updateArgs = @{}
          if ($env:PJ_WINDOWS_UPDATE_URL) {
            $updateArgs = @{ UpdateUrl = $env:PJ_WINDOWS_UPDATE_URL; RepoOutDir = "dist/repo" }
          }
          .\packaging\installer\build_windows_installer.ps1 `
            -QtDir ".qt\$env:PJ_QT_VERSION\msvc2022_64" `
            -PluginRegistryUrl "https://raw.githubusercontent.com/PlotJuggler/pj-plugin-registry/refs/heads/development/registry.json" `
            -LocalPluginDir dist-plugins `
            -Version $env:PJ_VERSION `
            -OutDir dist `
            -CleanReleaseName:($env:GITHUB_REF_TYPE -eq "tag") `
            @updateArgs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotJuggler-${{ env.PJ_VERSION }}-Windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload the update repository (rehearsal)
        if: github.event_name != 'push' && env.PJ_WINDOWS_UPDATE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: update-repo-${{ env.PJ_VERSION }}
          path: dist/repo
          if-no-files-found: error
          retention-days: 7

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.update_url == ''
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish the update repository
        if: env.PJ_WINDOWS_UPDATE_URL != ''
        shell: pwsh
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          .\packaging\installer\publish_update_repo.ps1 `
            -RepoDir dist/repo `
            -Version $env:PJ_VERSION

  update-check:
    needs: windows-installer
    if: inputs.update_check_from_run != '' && needs.windows-installer.outputs.update_url != ''
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_RUN: ${{ inputs.update_check_from_run }}
      EXPECT: ${{ needs.windows-installer.outputs.version }}
      UPDATE_URL: ${{ needs.windows-installer.outputs.update_url }}
    steps:
      - name: Download the older installer
        shell: bash
        run: gh run download "${OLD_RUN}" --repo "${GITHUB_REPOSITORY}" --dir old

      - name: Install it offline, then install and update it online
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "pj4"
          function Invoke-Ifw([string]$exe, [string[]]$ifwArgs, [switch]$AllowFailure) {
            $p = Start-Process $exe -ArgumentList $ifwArgs -Wait -PassThru -NoNewWindow `
                   -RedirectStandardOutput ifw.out -RedirectStandardError ifw.err
            Get-Content ifw.out, ifw.err | Out-Host
            if (-not $AllowFailure -and $p.ExitCode -ne 0) { throw "$exe $ifwArgs exited $($p.ExitCode)" }
          }
          function Get-InstalledVersion([string]$dir = $root) {
            [xml]$c = Get-Content (Join-Path $dir "components.xml")
            ($c.Packages.Package | Where-Object { $_.Name -eq "io.plotjuggler.application" }).Version
          }

          $installer = (Get-ChildItem old -Recurse -Filter *.exe | Select-Object -First 1).FullName
          if (-not $installer) { throw "No installer .exe was downloaded from run $env:OLD_RUN" }

          $updateHost = ([uri]$env:UPDATE_URL).Host
          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          $saved = Get-Content -Raw $hosts
          Add-Content $hosts "`n0.0.0.0 $updateHost`n:: $updateHost"
          ipconfig /flushdns | Out-Null
          try {
            $reachable = $true
            try {
              Invoke-WebRequest "$env:UPDATE_URL/Updates.xml" -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch {
              $reachable = $false
            }
            if ($reachable) { throw "$updateHost is still reachable; the offline check would prove nothing" }

            $offRoot = Join-Path $env:RUNNER_TEMP "pj4-offline"
            Write-Host "offline: installing $installer into $offRoot with $updateHost blocked"
            Invoke-Ifw $installer @("install", "--root", $offRoot, "--accept-licenses", "--default-answer", "--confirm-command")
            $offline = Get-InstalledVersion $offRoot
            if (-not $offline -or $offline -eq $env:EXPECT) {
              throw "offline install reports [$offline]; expected the installer's own version"
            }
            if (-not (Test-Path (Join-Path $offRoot "bin\PlotJuggler4.exe"))) {
              throw "offline install has no bin\PlotJuggler4.exe"
            }
            Write-Host "offline install OK: $offline"
          } finally {
            [IO.File]::WriteAllText($hosts, $saved)
            ipconfig /flushdns | Out-Null
          }

          $oldRepo = (Get-ChildItem old -Recurse -Filter Updates.xml | Select-Object -First 1).DirectoryName
          if (-not $oldRepo) { throw "run $env:OLD_RUN has no update-repo artifact; rebuild it with update_url set" }
          $oldRepoUri = ([uri]$oldRepo).AbsoluteUri
          Write-Host "installing $installer into $root, resolving only $oldRepoUri"
          Invoke-Ifw $installer @("install", "--root", $root, "--set-temp-repository", $oldRepoUri,
                                 "--accept-licenses", "--default-answer", "--confirm-command")
          $before = Get-InstalledVersion
          Write-Host "installed: $before"
          if ($before -eq $env:EXPECT) { throw "the older installer is already $env:EXPECT; nothing to update" }

          $tool = Join-Path $root "maintenancetool.exe"
          Write-Host "--- check-updates ---"
          Invoke-Ifw $tool @("check-updates") -AllowFailure
          Write-Host "--- update ---"
          Invoke-Ifw $tool @("update", "--accept-licenses", "--default-answer", "--confirm-command")

          $after = Get-InstalledVersion
          if ($after -ne $env:EXPECT) { throw "after the update components.xml says $after, expected $env:EXPECT" }
          if (-not (Test-Path (Join-Path $root "bin\PlotJuggler4.exe"))) {
            throw "bin\PlotJuggler4.exe missing after the update"
          }
          Write-Host "updated $before -> $after"
